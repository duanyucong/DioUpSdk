plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.dtcomg.dioupsdk.alt'
    compileSdk 35

    defaultConfig {
        applicationId "com.dtcomg.dioupsdk.alt"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':dio_up')
}
